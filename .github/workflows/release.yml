name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: 要发布的版本标签（例如 v0.1.3）
                required: true
                type: string

permissions:
    contents: write

jobs:
    build:
        name: 构建 Windows（x64 NSIS）
        runs-on: windows-latest
        env:
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - name: 校验发布标签
              shell: pwsh
              run: |
                  if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
                      throw "发布标签格式无效：$env:RELEASE_TAG"
                  }
                  $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  if ($env:RELEASE_TAG -ne "v$packageVersion") {
                      throw "标签 $env:RELEASE_TAG 与项目版本 v$packageVersion 不一致"
                  }

            - name: 安装 Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 20
                  cache: npm

            - name: 安装 Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Rust 缓存
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: 安装前端依赖
              run: npm ci

            - name: 提取当前版本更新日志
              id: release_notes
              shell: pwsh
              run: |
                  $version = $env:RELEASE_TAG.TrimStart("v")
                  $lines = Get-Content CHANGELOG.md -Encoding utf8
                  $heading = "^## \[$([regex]::Escape($version))\]"
                  $start = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match $heading } | Select-Object -First 1
                  if ($null -eq $start) {
                      throw "CHANGELOG.md 中缺少版本 $version 的更新日志"
                  }
                  $next = (($start + 1)..($lines.Count - 1) | Where-Object { $lines[$_] -match '^## \[' } | Select-Object -First 1)
                  $end = if ($null -eq $next) { $lines.Count } else { $next }
                  $body = ($lines[$start..($end - 1)] -join "`n").Trim()
                  "body<<KIMICODEBAR_RELEASE_NOTES" >> $env:GITHUB_OUTPUT
                  $body >> $env:GITHUB_OUTPUT
                  "KIMICODEBAR_RELEASE_NOTES" >> $env:GITHUB_OUTPUT

            - name: 检查更新签名密钥
              shell: pwsh
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
                      throw "仓库 Secret TAURI_SIGNING_PRIVATE_KEY 尚未配置"
                  }

            - name: 构建并上传到 Release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
              with:
                  tagName: ${{ env.RELEASE_TAG }}
                  releaseName: "KimiCodeBar ${{ env.RELEASE_TAG }}"
                  releaseBody: ${{ steps.release_notes.outputs.body }}
                  releaseDraft: false
                  prerelease: false
                  includeUpdaterJson: true
                  updaterJsonPreferNsis: true
