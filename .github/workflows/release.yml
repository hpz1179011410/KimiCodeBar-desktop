name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        name: 构建 ${{ matrix.name }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Windows (x64 NSIS)
                      platform: windows-latest
                      args: ""
                    - name: macOS (Apple Silicon)
                      platform: macos-latest
                      args: --target aarch64-apple-darwin
                    - name: macOS (Intel)
                      platform: macos-latest
                      args: --target x86_64-apple-darwin
                    - name: Linux (x64 deb / AppImage)
                      platform: ubuntu-22.04
                      args: ""

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: 安装 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 安装 Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  # macos-latest 当前为 Apple Silicon runner；Intel 构建需额外安装 x86_64 target。
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust 缓存
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            # Linux 系统依赖：Tauri 2 使用 WebKitGTK 4.1 / libsoup 3；
            # libdbus 用于 keyring secret-service 后端。
            - name: 安装 Linux 系统依赖
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    libdbus-1-dev \
                    patchelf

            - name: 安装前端依赖
              run: npm ci

            # macOS 未签名：发布说明里提示用户右键打开（Gatekeeper）
            - name: 构建并上传到 Release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: "KimiCodeBar ${{ github.ref_name }}"
                  releaseBody: |
                      ## 下载

                      - **Windows**：`KimiCodeBar_x.x.x_x64-setup.exe`（NSIS，当前用户安装，无需管理员权限）
                      - **macOS**：`.dmg`（Apple Silicon / Intel 两个目标）——未签名，首次打开请右键 → 打开
                      - **Linux**：`.deb` / `.AppImage`——运行需要 D-Bus + 桌面钥匙串（gnome-keyring 或 KWallet）

                      详细变更见 [CHANGELOG.md](CHANGELOG.md)。
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
