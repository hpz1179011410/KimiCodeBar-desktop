name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        name: 构建 Windows（x64 NSIS）
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - name: 安装 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 安装 Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Rust 缓存
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: 安装前端依赖
              run: npm ci

            - name: 构建并上传到 Release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: "KimiCodeBar ${{ github.ref_name }}"
                  releaseBody: |
                      ## 下载

                      - **Windows**：`KimiCodeBar_x.x.x_x64-setup.exe`（NSIS，当前用户安装，无需管理员权限）

                      详细变更见 [CHANGELOG.md](CHANGELOG.md)。
                  releaseDraft: true
                  prerelease: false
